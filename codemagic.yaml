# Compila Qullqi para iPhone en un Mac en la nube y deja un .ipa SIN FIRMAR
# para instalarlo desde Windows con Sideloadly (firma con tu Apple ID).
#
# Cuando haya cuenta de Apple Developer, este flujo se reemplaza por uno que
# firma y sube a TestFlight.
workflows:
  ios-sin-firmar:
    name: iPhone (sin firmar)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Dependencias
        script: flutter pub get
      - name: Compilar para iPhone
        script: flutter build ios --release --no-codesign
      - name: Empaquetar el .ipa
        script: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/Runner.app
          cd build/ipa
          zip -qr Qullqi.ipa Payload
    artifacts:
      - build/ipa/Qullqi.ipa
