# Compila Inti para iPhone en un Mac en la nube y deja un .ipa SIN FIRMAR
# para instalarlo desde Windows con Sideloadly (firma con tu Apple ID).
#
# Hay dos flujos:
#   - ios-sin-firmar: la app sola. Es el que ya funciona; usa este si el otro
#     falla o si Sideloadly rechaza las extensiones.
#   - ios-con-widgets: la app + widgets de pantalla de inicio/bloqueo + atajos
#     de Siri. EXPERIMENTAL: lo nativo no se pudo probar en Windows, así que la
#     primera corrida puede pedir ajustes (mira el log).
#
# Cuando haya cuenta de Apple Developer, estos flujos se reemplazan por uno que
# firma y sube a TestFlight.
workflows:
  ios-sin-firmar:
    name: iPhone (sin firmar)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Dependencias
        script: flutter pub get
      - name: Compilar para iPhone
        script: flutter build ios --release --no-codesign
      - name: Empaquetar el .ipa
        script: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/Runner.app
          cd build/ipa
          zip -qr Inti.ipa Payload
    artifacts:
      - build/ipa/Inti.ipa

  ios-con-widgets:
    name: iPhone con widgets y atajos (experimental)
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Dependencias
        script: flutter pub get
      - name: Añadir la extensión de widgets al proyecto de Xcode
        script: ruby ios/scripts/add_widget_extension.rb
      - name: Compilar para iPhone
        script: flutter build ios --release --no-codesign
      - name: Revisar que la extensión quedó dentro
        script: |
          ls build/ios/iphoneos/Runner.app/PlugIns
          test -d build/ios/iphoneos/Runner.app/PlugIns/IntiWidget.appex
      - name: Empaquetar el .ipa
        script: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/Runner.app
          cd build/ipa
          zip -qr Inti-widgets.ipa Payload
    artifacts:
      - build/ipa/Inti-widgets.ipa
